<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縦スクロール画像</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden; /* 横スクロールを無効にする */
        }

        .image-container {
            display: flex;
            flex-direction: column; /* 縦に並べる */
            width: 100vw; /* 画面幅に合わせる */
            height: 100%; /* 高さは必要な分だけ */
            overflow-y: scroll; /* 縦スクロールを有効に */
            align-items: center; /* 画像を横方向に中央揃え */
            justify-content: flex-start; /* 画像を上から順に配置 */
        }

        .image-container img {
            width: 100%; /* 横幅に合わせてリサイズ */
            height: auto; /* 高さは自動調整 */
            object-fit: contain; /* 縦横比を保ちながら画像が収まるように */
            max-height: 100vh; /* 現在の50vhの0.7倍に設定 */
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="sotusei/sotusei/image3.jpg" alt="Image 1">
        <img src="sotusei/sotusei/image2.jpg" alt="Image 2">
        <img src="sotusei/sotusei/image1.jpg" alt="Image 3">
    </div>
</body>
</html>
